<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pantheon docs</title>
  <meta name="description" content="Pantheon documentation.">
  <meta property="og:title" content="Pantheon docs">
  <meta property="og:type" content="website">
  <meta property="og:image" content="logo.png">
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f[]=array@400,500,600,700&f[]=alpino@400,500,600,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function() {
      var saved = localStorage.getItem('pantheon-theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved ? saved : (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="tokens.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['selector', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            brand: '#7223FF', branddark: '#5c1de0'
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'monospace'],
            sans: ['Alpino', 'Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: var(--ground); color: var(--ink); font-family: 'Alpino', 'Inter', sans-serif; font-size: 1.0625rem; line-height: 1.7; transition: background 0.2s ease, color 0.2s ease; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .hairline { height: 1px; background: var(--rule-soft); }
    .logo-mark { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex: none;
      filter: drop-shadow(0 2px 8px rgba(114,35,255,.25)); transition: transform .2s; }
    .logo-mark:hover { transform: scale(1.08); }
    .logo-mark img { height: 38px; width: auto; }

    /* Doc content type scale: h1 30 / h2 22 / h3 20 / body 16 (each step >= 1.25x) */
    .doc h1 { font-family: 'Array', sans-serif; font-size: 2rem; font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; color: var(--ink); margin-bottom: 1rem; }
    .doc h2 { font-size: 1.375rem; font-weight: 600; line-height: 1.25; letter-spacing: -0.01em; color: var(--ink); margin-top: 2rem; margin-bottom: 0.5rem; }
    .doc h3 { font-size: 1.2rem; font-weight: 600; line-height: 1.3; color: var(--ink); margin-top: 1.5rem; }
    .doc p, .doc li { color: var(--ink-2); }
    .doc strong { color: var(--ink); }
    .doc pre {
      background: var(--inset);
      border: 1px solid var(--rule-soft);
      border-radius: 12px;
      padding: 1.25rem 1.4rem;
      overflow-x: auto;
      margin: 1.5rem 0;
      position: relative;
    }
    .doc pre code { font-family: 'JetBrains Mono', monospace; font-size: .85rem; color: var(--ink); background: none; padding: 0; }
    .doc code:not(pre code) {
      font-family: 'JetBrains Mono', monospace;
      font-size: .85em;
      color: var(--accent-strong);
      background: var(--accent-soft);
      padding: 2px 6px;
      border-radius: 5px;
    }
    .doc table { border-collapse: collapse; width: 100%; margin: 1.5rem 0; font-size: 0.95rem; }
    .doc th, .doc td { border-bottom: 1px solid var(--rule-soft); padding: .75rem .9rem; text-align: left; vertical-align: top; }
    .doc th { font-size: .75rem; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
    .doc tr:hover td { background: var(--hover); }
    .doc blockquote {
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
      border-radius: 0 10px 10px 0;
      padding: 0.9rem 1.25rem;
      margin: 1.5rem 0;
      color: var(--ink-2);
    }
    .doc p a, .doc li a, .doc td a { color: var(--accent-strong); text-decoration: underline; text-underline-offset: 3px; }
    .doc p a:hover, .doc li a:hover, .doc td a:hover { color: var(--accent); }
    .doc ul { list-style: disc; padding-left: 1.5rem; }
    .doc ol { list-style: decimal; padding-left: 1.5rem; }

    /* Code block copy button */
    .pre-wrap { position: relative; margin: 1.5rem 0; }
    .pre-wrap pre { margin: 0; }
    .copy-code-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      background: var(--surface-2);
      border: 1px solid var(--rule-soft);
      color: var(--ink-2);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s ease, background 0.15s ease;
    }
    .pre-wrap:hover .copy-code-btn { opacity: 1; }
    .copy-code-btn:hover { background: var(--hover); color: var(--ink); }

    /* Theme toggle button */
    .theme-toggle-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--rule-soft);
      background: var(--surface);
      color: var(--ink-2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .theme-toggle-btn:hover { color: var(--ink); border-color: var(--rule); background: var(--hover); }
    [data-theme="dark"] .icon-sun { display: block; }
    [data-theme="dark"] .icon-moon { display: none; }
    [data-theme="light"] .icon-sun { display: none; }
    [data-theme="light"] .icon-moon { display: block; }

    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    @media (max-width: 640px) {
      .doc table { display: block; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    }
  </style>
</head>
<body class="antialiased">

  <header class="max-w-6xl mx-auto px-6 md:px-10 pt-8 flex items-center justify-between border-b pb-6" style="border-color: var(--rule-soft);">
    <a href="index.html" class="flex items-center gap-2.5" aria-label="Pantheon home">
      <span class="logo-mark"><img src="logo.svg" alt="" width="38" height="38"></span>
      <span class="font-semibold text-lg tracking-tight" style="color: var(--ink)">pantheon</span>
    </a>
    <nav class="flex items-center gap-5 md:gap-7 text-[15px]" aria-label="Main">
      <a href="product.html" class="hidden sm:inline transition-colors" style="color: var(--ink-2);" onmouseover="this.style.color='var(--ink)'" onmouseout="this.style.color='var(--ink-2)'">Product</a>
      <a href="install.html" class="hidden sm:inline transition-colors" style="color: var(--ink-2);" onmouseover="this.style.color='var(--ink)'" onmouseout="this.style.color='var(--ink-2)'">Install</a>
      <a href="docs.html" class="hidden sm:inline font-semibold" style="color: var(--ink);">Docs</a>
      <a href="https://github.com/k1ng0mar/pantheon" target="_blank" rel="noopener" class="hidden sm:inline transition-colors" style="color: var(--ink-2);" onmouseover="this.style.color='var(--ink)'" onmouseout="this.style.color='var(--ink-2)'">GitHub</a>
      
      <button id="theme-btn" class="theme-toggle-btn" aria-label="Toggle dark/light theme" title="Toggle theme">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>

      <button type="button" id="menu-btn" class="sm:hidden text-sm px-3 py-2 min-h-[44px]" style="color: var(--ink-2);" aria-expanded="false" aria-controls="menu">menu</button>
    </nav>
  </header>
  <div id="menu" class="hidden sm:hidden max-w-6xl mx-auto px-6 py-4 flex-col gap-1 text-[15px] border-b" style="border-color: var(--rule-soft);">
    <a href="product.html" class="py-2.5 block" style="color: var(--ink-2);">Product</a>
    <a href="install.html" class="py-2.5 block" style="color: var(--ink-2);">Install</a>
    <a href="docs.html" class="py-2.5 block font-semibold" style="color: var(--ink);">Docs</a>
    <a href="https://github.com/k1ng0mar/pantheon" target="_blank" rel="noopener" class="py-2.5 block" style="color: var(--ink-2);">GitHub</a>
  </div>

  %BODY%

  <footer class="border-t mt-16" style="border-color: var(--rule-soft);">
    <div class="max-w-6xl mx-auto px-6 md:px-10 py-14">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-8">
        <div class="flex items-center gap-2.5">
          <span class="logo-mark"><img src="logo.svg" alt="" width="38" height="38"></span>
          <span class="font-semibold" style="color: var(--ink)">pantheon</span>
        </div>
        <div class="flex flex-wrap gap-x-8 gap-y-3 text-sm">
          <a href="product.html" style="color: var(--ink-2);">Product</a>
          <a href="install.html" style="color: var(--ink-2);">Install</a>
          <a href="docs.html" style="color: var(--ink-2);">Docs</a>
          <a href="https://github.com/k1ng0mar/pantheon" target="_blank" rel="noopener" style="color: var(--ink-2);">GitHub</a>
        </div>
      </div>
      <p class="text-sm mt-10" style="color: var(--ink-3);">An assistant that does everything. The model proposes. Pantheon disposes. MIT licensed.</p>
    </div>
  </footer>

  <script>
    // Theme toggle handling
    var themeBtn = document.getElementById('theme-btn');
    if (themeBtn) {
      themeBtn.addEventListener('click', function() {
        var current = document.documentElement.getAttribute('data-theme') || 'dark';
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('pantheon-theme', next);
      });
    }

    // Mobile menu toggle
    var menuBtn = document.getElementById('menu-btn');
    var menu = document.getElementById('menu');
    if (menuBtn && menu) {
      menuBtn.addEventListener('click', function () {
        var isHidden = menu.classList.toggle('hidden');
        menu.classList.toggle('flex', !isHidden);
        menuBtn.setAttribute('aria-expanded', String(!isHidden));
      });
    }

    // Wrap pre code blocks with copy button
    document.querySelectorAll('.doc pre').forEach(function(pre) {
      var wrap = document.createElement('div');
      wrap.className = 'pre-wrap';
      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(pre);

      var btn = document.createElement('button');
      btn.className = 'copy-code-btn';
      btn.textContent = 'Copy';
      btn.setAttribute('aria-label', 'Copy code snippet');
      wrap.appendChild(btn);

      btn.addEventListener('click', function() {
        var text = pre.querySelector('code') ? pre.querySelector('code').textContent : pre.textContent;
        navigator.clipboard.writeText(text).then(function() {
          btn.textContent = 'Copied!';
          setTimeout(function() { btn.textContent = 'Copy'; }, 1800);
        });
      });
    });
  </script>

</body>
</html>
