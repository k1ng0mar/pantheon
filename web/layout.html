<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pantheon: Rust Agent Runtime</title>
  <meta name="description" content="A Rust agent runtime where the model is one replaceable component. Capability-gated execution, event-sourced ledger, crash recovery.">
  <meta property="og:title" content="Pantheon: Rust Agent Runtime">
  <meta property="og:description" content="A Rust agent runtime where the model is one replaceable component. Capability-gated execution, event-sourced ledger, crash recovery.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#0d0d0d', fg: '#e8e6e1', muted: '#71717a', accent: '#7223FF', accentdark: '#4B00CD',
            card: '#1c1c1e', border: '#2e2e30',
          },
          fontFamily: { mono: ['JetBrains Mono', 'monospace'], sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: #0d0d0d; color: #e8e6e1; font-family: 'Inter', sans-serif; }
    .glow-line { height: 1px; background: linear-gradient(90deg, transparent, #7223FF, transparent); }
    .radial-core { background: radial-gradient(ellipse at center, rgba(114,35,255,0.06) 0%, transparent 70%); }
    .logo-mark { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
    .logo-mark img { height: 32px; width: auto; }
    .logo-mark-sm { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
    .logo-mark-sm img { height: 22px; width: auto; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    pre { background: #1c1c1e; border: 1px solid #2e2e30; border-radius: 8px; padding: 1rem; overflow-x: auto; }
    pre code { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: #e8e6e1; }
    code:not(pre code) { font-family: 'JetBrains Mono', monospace; font-size: 0.85em; color: #7223FF; background: rgba(114,35,255,0.1); padding: 0.15em 0.3em; border-radius: 3px; }
    h1, h2, h3, h4 { font-family: 'JetBrains Mono', monospace; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #2e2e30; padding: 0.5rem 0.75rem; text-align: left; font-size: 0.85rem; }
    th { font-family: 'JetBrains Mono', monospace; color: #71717a; font-weight: 500; }
    tr:hover td { background: rgba(114,35,255,0.05); }
    blockquote { border-left: 2px solid #7223FF; padding-left: 1rem; margin: 1rem 0; color: #e8e6e1; font-style: italic; }
    p a, li a, td a { color: #e8e6e1; text-decoration: underline; text-decoration-color: #7223FF; text-underline-offset: 3px; }
    details { cursor: pointer; }
    details summary { list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details[open] summary .chevron { transform: rotate(90deg); }
    .chevron { display: inline-block; transition: transform 0.15s; }
    @media (max-width: 640px) {
      table { display: block; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    }
  </style>
</head>
<body class="antialiased">

  <nav class="fixed top-0 left-0 right-0 z-50 bg-bg/80 backdrop-blur border-b border-border">
    <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between gap-6">
      <a href="index.html" class="flex items-center gap-3">
        <div class="logo-mark"><img src="logo.svg" alt="Pantheon" width="32" height="32"></div>
        <span class="font-mono font-bold text-fg text-lg tracking-tight">pantheon</span>
      </a>
      <div class="hidden md:flex items-center gap-6 text-sm">
        <a href="index.html" class="text-muted hover:text-fg transition-colors">Home</a>
        <a href="product.html" class="text-muted hover:text-fg transition-colors">Product</a>
        <a href="install.html" class="text-muted hover:text-fg transition-colors">Install</a>
        <a href="docs.html" class="text-muted hover:text-fg transition-colors">Docs</a>
        <a href="terminal.html" class="text-muted hover:text-fg transition-colors">Terminal</a>
        <a href="https://github.com/k1ng0mar/pantheon" target="_blank" rel="noopener" class="text-muted hover:text-fg transition-colors">GitHub</a>
      </div>
      <button type="button" id="menu-btn" class="md:hidden text-muted hover:text-fg font-mono text-sm px-2 py-1" aria-expanded="false" aria-controls="menu">menu</button>
    </div>
    <div id="menu" class="hidden md:hidden border-t border-border px-6 py-4 flex-col gap-4 text-sm">
      <a href="index.html" class="text-muted hover:text-fg transition-colors">Home</a>
      <a href="product.html" class="text-muted hover:text-fg transition-colors">Product</a>
      <a href="install.html" class="text-muted hover:text-fg transition-colors">Install</a>
      <a href="docs.html" class="text-muted hover:text-fg transition-colors">Docs</a>
      <a href="terminal.html" class="text-muted hover:text-fg transition-colors">Terminal</a>
      <a href="https://github.com/k1ng0mar/pantheon" target="_blank" rel="noopener" class="text-muted hover:text-fg transition-colors">GitHub</a>
    </div>
  </nav>

  %BODY%

  <div class="glow-line max-w-5xl mx-auto"></div>

  <footer class="py-16">
    <div class="max-w-5xl mx-auto px-6">
      <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
        <div class="flex items-center gap-3">
          <div class="logo-mark-sm"><img src="logo.svg" alt="Pantheon" width="22" height="22"></div>
          <div>
            <span class="font-mono font-bold text-fg text-sm">pantheon</span>
            <p class="text-muted text-xs mt-0.5">Durable agent runtime. MIT licensed. <span class="font-mono">k1ng0mar/pantheon</span> on GitHub.</p>
          </div>
        </div>
        <div class="flex gap-8 text-sm">
          <a href="https://github.com/k1ng0mar/pantheon" target="_blank" rel="noopener" class="text-muted hover:text-fg transition-colors">Source</a>
          <a href="https://github.com/k1ng0mar/pantheon/blob/master/README.md" target="_blank" rel="noopener" class="text-muted hover:text-fg transition-colors">Docs</a>
          <a href="https://github.com/k1ng0mar/pantheon/blob/master/docs/developer/contributing.md" target="_blank" rel="noopener" class="text-muted hover:text-fg transition-colors">Contribute</a>
        </div>
      </div>
      <div class="glow-line my-8"></div>
      <p class="text-muted text-xs text-center">No hosted tier. No subscription. Your data stays on your machine.</p>
    </div>
  </footer>

  <script>
    var menuBtn = document.getElementById('menu-btn');
    var menu = document.getElementById('menu');
    if (menuBtn && menu) {
      menuBtn.addEventListener('click', function () {
        var isHidden = menu.classList.toggle('hidden');
        menu.classList.toggle('flex', !isHidden);
        menuBtn.setAttribute('aria-expanded', String(!isHidden));
      });
    }
  </script>

</body>
</html>
