[toolchain]
# A true pin: CI (dtolnay/rust-toolchain@v1 with no toolchain input)
# reads this file, so local and CI resolve the same rustfmt/clippy.
# Without it, a new stable's rustfmt reformats silently and the fmt gate
# goes red (audit F9).
#
# To move the pin: `rustup install <new>` + `cargo fmt --all` + commit the
# resulting diff with this file updated, as one reviewable change.
channel = "1.99.1"

[components]
rustfmt = true
clippy = true
rust-analyzer = true
