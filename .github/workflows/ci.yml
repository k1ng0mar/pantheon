name: ci

on:
  push:
    branches: [master, main]
  pull_request:

# Cancel superseded runs on the same ref. A push while a PR is open runs
# twice otherwise, and the second run is the only one that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Release-profile assertions are the point of this job; debug misses them.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No toolchain input: the action reads the pinned channel from
      # rust-toolchain.toml, so CI and local fmt/clippy resolution can
      # never drift apart (the audit-F9 failure mode).
      - uses: dtolnay/rust-toolchain@v1
        with:
          # rust-analyzer: the LSP tests drive the real server, and a
          # rustup shim with no installed component is on PATH but exits
          # during initialize, which reads as LSP_DEAD.
          components: rustfmt, clippy, rust-analyzer

      # Dependency cache. Keyed on the lockfile so an unchanged manifest
      # reuses the compiled deps.
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: test
        run: cargo test --workspace

  build:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the pinned channel from rust-toolchain.toml, like the check
      # job. `@stable` here meant the release smoke test ran on a different
      # compiler than the artifacts actually ship with.
      - uses: dtolnay/rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      # The installer promises a working binary. Prove the artifact runs,
      # so a green test suite cannot ship a binary that does not start.
      - name: smoke test the release binary
        run: |
          ./target/release/pantheon --version
          ./target/release/pantheon --help > /dev/null

  cross-platform:
    name: cross-platform tests
    # Platform branches (pantheon-helper's tasklist/sc, sandbox path
    # handling, dotenv permissions, oauth, self-update) are compiled on
    # Windows and macOS by the release matrix but have never been *tested*
    # there. This job runs the crates that actually branch on platform.
    #
    # `continue-on-error` is deliberate for the first pass: these paths have
    # never executed anywhere but Linux, so treating the first red as a
    # merge blocker would freeze every PR on pre-existing breakage. Flip it
    # to false once this job has been green for a full week; the tracking
    # issue is in docs/developer/ci.md.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: test the platform-branching crates
        run: cargo test -p pantheon-helper -p pantheon-exec -p pantheon-api

  eval:
    name: eval harness (real CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      # The harness drives the real binary, so it needs a build. Debug is
      # enough and much faster than release.
      - name: build the CLI
        run: cargo build -p pantheon-tui --bin pantheon
      # eval/run.py is a stdlib-only regression suite over the shipped CLI.
      # It was never wired into CI, so its 22 cases - including the run
      # lifecycle, audit, memory and send paths - ran nowhere by default,
      # and 12 of them skipped permanently for want of a binary.
      - name: run eval cases
        env:
          PANTHEON_BIN: target/debug/pantheon
        run: python3 eval/run.py

  desktop:
    name: desktop typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `desktop/` is excluded from the Cargo workspace, and its own
      # `desktop/.github/workflows/ci.yml` is inert in this monorepo:
      # GitHub only reads the workflow directory at the repository root.
      # Without this job the desktop's TypeScript is never typechecked
      # and its 137 unit tests never run.
      - uses: actions/setup-node@v4
        with:
          # Type stripping (needed: the tests import src/*.ts directly) is
          # on by default from Node 22.18; the tag resolves to latest 22.x.
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      # `npm run build` is `tsc --noEmit && vite build`; the build also
      # writes dist/, which tests/bundle.test.mjs reads.
      - run: npm run build
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run test:release
        working-directory: desktop

  desktop-rust:
    name: desktop Rust tests + clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # The workflow-level `RUSTFLAGS: -D warnings` reaches every crate cargo
    # compiles, dependencies included. The desktop pulls in Tauri, so deny only
    # this crate's own lints: clippy below passes `-D warnings` itself.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      # Tauri embeds the built frontend, so dist/ must exist before cargo runs.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@v1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      # 1277 tests over the whole desktop runtime. `cargo test --workspace`
      # above cannot reach them: root Cargo.toml excludes `desktop`.
      - run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --lib
      - if: ${{ !cancelled() }}
        run: cargo clippy --locked --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

  install-smoke:
    name: installer smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run installer against latest release
        env:
          PANTHEON_NO_INIT: "1"
          PANTHEON_NO_PYTHON_DEPS: "1"
          PANTHEON_INSTALL_DIR: ${{ runner.temp }}/pantheon-bin
        run: |
          bash install.sh
          "${PANTHEON_INSTALL_DIR}/pantheon" --version
          "${PANTHEON_INSTALL_DIR}/pantheon" --help > /dev/null
