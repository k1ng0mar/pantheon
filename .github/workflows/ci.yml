name: ci

on:
  push:
    branches: [master, main]
  pull_request:

# Cancel superseded runs on the same ref. A push while a PR is open runs
# twice otherwise, and the second run is the only one that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repository. Without this block the
# job token got the repository's default scope (audit, CI hardening).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Release-profile assertions are the point of this job; debug misses them.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No toolchain input: the action reads the pinned channel from
      # rust-toolchain.toml, so CI and local fmt/clippy resolution can
      # never drift apart (the audit-F9 failure mode).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          # rust-analyzer: the LSP tests drive the real server, and a
          # rustup shim with no installed component is on PATH but exits
          # during initialize, which reads as LSP_DEAD.
          components: rustfmt, clippy, rust-analyzer

      # reuses the compiled deps.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: test
        run: cargo test --workspace --locked

  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every PR, not only the weekly drift job: an advisory against a
      # locked dependency (RUSTSEC-2026-0459, libsqlite3-sys) sat in the
      # tree between weekly runs.
      - uses: taiki-e/install-action@f84dff0ad3f25ff0e5dc531e626734a4e7d11ac7 # cargo-audit
      - run: cargo audit
      - name: Desktop Tauri advisories
        # Separate lock file, excluded from the root workspace. Auditing
        # only the root lock leaves the whole desktop Rust tree unchecked.
        run: cargo audit --file desktop/src-tauri/Cargo.lock

  sandbox-root:
    name: sandbox tests as root
    # Root runs binaries built from the checked out source. Only do that on
    # trusted pushes; fork pull requests get the unprivileged `check` job.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Root takes paths the unprivileged runner never reaches: NPROC is
      # not enforced (the probe leak, audit COR-01), capabilities exist to
      # drop (SEC-10), and the VeryHigh seccomp/Landlock tier and the
      # credential masks can actually be exercised (COR-02, SEC-01).
      # Build as the runner user, run the test binaries as root.
      - name: build sandbox test binaries
        run: cargo test -p pantheon-eval --test sandbox_runner --test sandbox_secrets --no-run --locked
      - name: run as root
        run: |
          for t in sandbox_runner sandbox_secrets; do
            bin=$(cargo test -p pantheon-eval --test "$t" --no-run --locked --message-format=json \
              | jq -r 'select(.reason=="compiler-artifact" and .executable!=null) | .executable' | tail -1)
            sudo env HOME=/root PATH=/usr/bin:/bin "$bin"
          done

  build:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reads the pinned channel from rust-toolchain.toml, like the check
      # job. `@stable` here meant the release smoke test ran on a different
      # compiler than the artifacts actually ship with.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release --workspace
      # The installer promises a working binary. Prove the artifact runs,
      # so a green test suite cannot ship a binary that does not start.
      - name: smoke test the release binary
        run: |
          ./target/release/pantheon --version
          ./target/release/pantheon --help > /dev/null

  cross-platform:
    name: cross-platform tests
    # Platform branches (pantheon-helper's tasklist/sc, sandbox path
    # handling, dotenv permissions, oauth, self-update) are compiled on
    # Windows and macOS by the release matrix but have never been *tested*
    # there. This job runs the crates that actually branch on platform.
    #
    # `continue-on-error` is deliberate for the first pass: these paths have
    # never executed anywhere but Linux, so treating the first red as a
    # merge blocker would freeze every PR on pre-existing breakage. Flip it
    # to false once this job has been green for a full week; the tracking
    # issue is in docs/developer/ci.md.
    # EXPIRES 2026-12-31: after that date this must be false, green or not.
    # The `cross-platform-expiry` job below enforces the date; a comment
    # alone was the finding (audit F10).
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: test the platform-branching crates
        run: cargo test -p pantheon-helper -p pantheon-exec -p pantheon-api

  cross-platform-expiry:
    name: cross-platform advisory expiry
    runs-on: ubuntu-latest
    # The `cross-platform` job above is advisory (`continue-on-error`) until
    # 2026-12-31. A comment is not a deadline: this job fails the workflow
    # once the date passes, so the advisory state cannot outlive its stated
    # window without someone deciding (audit F10).
    steps:
      - name: fail once the advisory window has expired
        run: |
          set -euo pipefail
          today="$(date -u +%Y%m%d)"
          if [ "$today" -ge 20261231 ]; then
            echo "::error::the cross-platform job is still continue-on-error past its 2026-12-31 expiry; set it to false (or delete the job) and update docs/developer/ci.md"
            exit 1
          fi
          echo "advisory window open until 2026-12-31 (today: $today)"

  eval:
    name: eval harness (real CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The harness drives the real binary, so it needs a build. Debug is
      # enough and much faster than release.
      - name: build the CLI
        run: cargo build -p pantheon-tui --bin pantheon
      # eval/run.py is a stdlib-only regression suite over the shipped CLI.
      # It was never wired into CI, so its 31 cases - including the run
      # lifecycle, audit, memory and send paths - ran nowhere by default,
      # and some skipped permanently for want of a binary.
      - name: run eval cases
        env:
          PANTHEON_BIN: target/debug/pantheon
        run: python3 eval/run.py

  desktop:
    name: desktop typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GitHub only reads the workflow directory at the repository root.
      # Without this job the desktop's TypeScript is never typechecked
      # and its 130 unit tests never run.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Type stripping (needed: the tests import src/*.ts directly) is
          # on by default from Node 22.18; the tag resolves to latest 22.x.
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      # `npm run build` is `tsc --noEmit && vite build`; the build also
      # writes dist/, which tests/bundle.test.mjs reads.
      - run: npm run build
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run test:release
        working-directory: desktop

  desktop-rust:
    name: desktop Rust tests + clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # The workflow-level `RUSTFLAGS: -D warnings` reaches every crate cargo
    # compiles, dependencies included. The desktop pulls in Tauri, so deny only
    # this crate's own lints: clippy below passes `-D warnings` itself.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Tauri embeds the built frontend, so dist/ must exist before cargo runs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          components: clippy
      - name: install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      # 934 tests over the whole desktop runtime. `cargo test --workspace`
      # above cannot reach them: root Cargo.toml excludes `desktop`.
      - run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --lib
      - if: ${{ !cancelled() }}
        run: cargo clippy --locked --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

  desktop-ui:
    name: desktop ui tests
    runs-on: ubuntu-22.04
    # One worker is the only setting this suite is green at: at two workers the
    # heavy specs (concurrency, turn-changes, jev-live) lose races to scheduler
    # latency. That makes the job slow, so the timeout is generous.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      # The Playwright webServer starts `npm run dev` itself, so no frontend
      # build is needed here. Chromium and its OS libraries are not on the
      # runner by default.
      - name: install chromium
        working-directory: desktop
        run: npx playwright install --with-deps chromium
      # Runs the reliable subset; playwright.ci.config.ts names the specs that
      # are excluded and why. See docs/developer/ci.md.
      - name: run the reliable ui subset
        working-directory: desktop
        env:
          PW_WORKERS: 1
        run: npx playwright test --config playwright.ci.config.ts

  install-smoke:
    name: installer smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: run installer against latest release
        env:
          PANTHEON_NO_INIT: "1"
          PANTHEON_NO_PYTHON_DEPS: "1"
          PANTHEON_INSTALL_DIR: ${{ runner.temp }}/pantheon-bin
        run: |
          bash install.sh
          "${PANTHEON_INSTALL_DIR}/pantheon" --version
          "${PANTHEON_INSTALL_DIR}/pantheon" --help > /dev/null
