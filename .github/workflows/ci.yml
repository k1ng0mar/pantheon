name: ci

on:
  push:
    branches: [master, main]
  pull_request:

# Cancel superseded runs on the same ref. A push while a PR is open runs
# twice otherwise, and the second run is the only one that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Release-profile assertions are the point of this job; debug misses them.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No toolchain input: the action reads the pinned channel from
      # rust-toolchain.toml, so CI and local fmt/clippy resolution can
      # never drift apart (the audit-F9 failure mode).
      - uses: dtolnay/rust-toolchain@v1
        with:
          # rust-analyzer: the LSP tests drive the real server, and a
          # rustup shim with no installed component is on PATH but exits
          # during initialize, which reads as LSP_DEAD.
          components: rustfmt, clippy, rust-analyzer

      # Dependency cache. Keyed on the lockfile so an unchanged manifest
      # reuses the compiled deps.
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: test
        run: cargo test --workspace

  build:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      # The installer promises a working binary. Prove the artifact runs,
      # so a green test suite cannot ship a binary that does not start.
      - name: smoke test the release binary
        run: |
          ./target/release/pantheon --version
          ./target/release/pantheon --help > /dev/null

  desktop:
    name: desktop typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `desktop/` is excluded from the Cargo workspace, and its own
      # `desktop/.github/workflows/ci.yml` is inert in this monorepo:
      # GitHub only reads the workflow directory at the repository root.
      # Without this job the desktop's TypeScript is never typechecked
      # and its 137 unit tests never run (M4 in docs/execution-ledger.md).
      - uses: actions/setup-node@v4
        with:
          # Type stripping (needed: the tests import src/*.ts directly) is
          # on by default from Node 22.18; the tag resolves to latest 22.x.
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      # `npm run build` is `tsc --noEmit && vite build`; the build also
      # writes dist/, which tests/bundle.test.mjs reads.
      - run: npm run build
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run test:release
        working-directory: desktop
