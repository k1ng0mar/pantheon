name: release

# One workflow, two release lanes. Do not collapse them into one tag:
#
# - `vX.Y.Z` builds the CLI. Those assets keep their exact names because
#   install.sh, install.ps1 and `pantheon update` construct them from the tag.
#   The CLI owns GitHub's `/releases/latest`.
# - `desktop-vX.Y.Z` builds the Tauri app. Its GitHub Release is published
#   with `--latest=false`, and the in-app updater reads `latest.json` from the
#   fixed `desktop-latest` Release, so a later CLI tag cannot shadow it.
#
# Manual runs build desktop installers only. Tick `publish` to create the
# desktop Release; unticked runs keep the installers as workflow artifacts.
# Job `if:` guards below keep each lane off the other lane's tag.

on:
  push:
    tags:
      - "v*"
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the desktop Release (manual runs build desktop installers)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  route:
    name: resolve release lane
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      track: ${{ steps.lane.outputs.track }}
      version: ${{ steps.lane.outputs.version }}
      publish: ${{ steps.lane.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve the lane and version
        id: lane
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            case "$GITHUB_REF_NAME" in
              v*)
                track=cli
                ;;
              desktop-v*)
                track=desktop
                ;;
              *)
                echo "::error::Unknown tag $GITHUB_REF_NAME. Use vX.Y.Z or desktop-vX.Y.Z."
                exit 1
                ;;
            esac
            echo "track=$track" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            # Manual runs build desktop installers only, as before.
            track=desktop
            echo "track=$track" >> "$GITHUB_OUTPUT"
            echo "publish=${PUBLISH:-false}" >> "$GITHUB_OUTPUT"
          fi
          if [ "$track" = desktop ]; then
            version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
            if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "desktop-v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match app version $version. Run npm run release:version first and tag desktop-v$version."
              exit 1
            fi
            if [ ! -s "desktop/releases/$version.md" ]; then
              echo "::error::desktop/releases/$version.md is missing or empty."
              exit 1
            fi
          else
            version=${GITHUB_REF_NAME#v}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "track=$track version=$version"

  cli-build:
    needs: route
    if: needs.route.outputs.track == 'cli'
    name: build (${{ matrix.target }} on ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: linux
            arch: x86_64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: darwin
            arch: x86_64
            # GitHub retired the x86_64 macOS runner pool; macos-13 jobs
            # queue forever. The arm runner cross-builds this target with
            # the std installed, and the asset name is unchanged, so
            # install.sh on Intel Macs keeps working.
            runner: macos-latest
          - target: aarch64-apple-darwin
            os: darwin
            arch: aarch64
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows
            arch: x86_64
            runner: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # No toolchain input: reads the pinned channel from
      # The pinned channel from rust-toolchain.toml, same as the ci workflow.
      # This action needs an explicit `toolchain`; unlike cargo it does not
      # read rust-toolchain.toml when no input is given.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.target }}

      - name: build
        run: cargo build --release --locked --bin pantheon --bin pantheon-helper --target ${{ matrix.target }}

      - name: package (unix)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/stage"
          mkdir -p "$staged"
          cp "target/${{ matrix.target }}/release/pantheon" "$staged/pantheon"
          cp "target/${{ matrix.target }}/release/pantheon-helper" "$staged/pantheon-helper"
          chmod +x "$staged/pantheon" "$staged/pantheon-helper"
          asset="pantheon-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          tar -czf "$RUNNER_TEMP/$asset" -C "$staged" pantheon pantheon-helper
          (cd "$RUNNER_TEMP" && sha256sum "$asset" > "$asset.sha256")
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: package (windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $staged = Join-Path $env:RUNNER_TEMP "stage"
          New-Item -ItemType Directory -Force -Path $staged | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/pantheon.exe" (Join-Path $staged "pantheon.exe")
          Copy-Item "target/${{ matrix.target }}/release/pantheon-helper.exe" (Join-Path $staged "pantheon-helper.exe")
          $asset = "pantheon-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.zip"
          Compress-Archive -Path (Join-Path $staged "pantheon.exe"),(Join-Path $staged "pantheon-helper.exe") -DestinationPath (Join-Path $env:RUNNER_TEMP $asset)
          $hash = (Get-FileHash (Join-Path $env:RUNNER_TEMP $asset) -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset" | Out-File -FilePath (Join-Path $env:RUNNER_TEMP "$asset.sha256") -Encoding ascii
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: sign asset (minisign)
        # Guarded, not required: until MINISIGN_SECRET_KEY is provisioned
        # (see docs/release-signing.md) this step skips and releases
        # ship unsigned - and `pantheon update` then fails closed rather
        # than installing them. Adding the step unconditionally would
        # break every release before provisioning.
        if: matrix.os != 'windows'
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "no MINISIGN_SECRET_KEY secret; skipping signing (releases stay unsigned until the key is provisioned)"
            exit 0
          fi
          case "${{ matrix.os }}" in
            linux) sudo apt-get update -qq && sudo apt-get install -y -qq minisign ;;
            darwin) brew install minisign ;;
          esac
          key="$RUNNER_TEMP/minisign.key"
          printf '%s' "$MINISIGN_SECRET_KEY" > "$key"
          chmod 600 "$key"
          minisign -S -s "$key" -m "$RUNNER_TEMP/$ASSET"
          rm -f "$key"
          ls -la "$RUNNER_TEMP/$ASSET.minisig"

      - name: sign asset (minisign, windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if (-not $env:MINISIGN_SECRET_KEY) { echo "no MINISIGN_SECRET_KEY secret; skipping signing"; exit 0 }
          # Chocolatey ships minisign 0.8, which cannot read the scrypt key
          # generated by minisign 0.11. Use the official 0.11 Windows build.
          $zip = Join-Path $env:RUNNER_TEMP "minisign-win64.zip"
          Invoke-WebRequest -Uri "https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "minisign-bin") -Force
          $minisign = (Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "minisign-bin") -Filter "minisign.exe" -Recurse | Select-Object -First 1).FullName
          if (-not $minisign) { throw "minisign.exe not found in the downloaded archive" }
          $key = Join-Path $env:RUNNER_TEMP "minisign.key"
          $env:MINISIGN_SECRET_KEY | Out-File -FilePath $key -Encoding ascii -NoNewline
          & $minisign -S -s $key -m (Join-Path $env:RUNNER_TEMP $env:ASSET)
          Remove-Item $key -Force

      - name: smoke test the packaged binary
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/smoke"
          mkdir -p "$tmp"
          if [ "${{ matrix.os }}" = "windows" ]; then
            unzip -o "$RUNNER_TEMP/$ASSET" -d "$tmp"
            "$tmp/pantheon.exe" --version
            "$tmp/pantheon.exe" --help > /dev/null
          else
            tar -xzf "$RUNNER_TEMP/$ASSET" -C "$tmp"
            "$tmp/pantheon" --version
            "$tmp/pantheon" --help > /dev/null
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/pantheon-*.tar.gz
            ${{ runner.temp }}/pantheon-*.zip
            ${{ runner.temp }}/pantheon-*.sha256
            ${{ runner.temp }}/pantheon-*.minisig


  cli-publish:
    name: publish release
    needs: [route, cli-build]
    if: needs.route.outputs.track == 'cli'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: list assets
        run: ls -la dist/
      # Make the release's trust state explicit on the release page. The
      # signing steps above skip when MINISIGN_SECRET_KEY is absent, so an
      # unsigned release can still be published; that is a documented
      # stopgap (docs/release-signing.md), but it must not be invisible.
      # `pantheon update` refuses unsigned releases, so the note tells a
      # user to install by hand instead of debugging a verify failure.
      - name: describe signing state
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "dist/*.minisig" > /dev/null; then
            echo 'status=Signed with minisign; `pantheon update` can verify this release.' >> "$GITHUB_OUTPUT"
          else
            echo "::warning::This release is UNSIGNED (MINISIGN_SECRET_KEY is not provisioned). pantheon update refuses it; users must install by hand."
            echo 'status=**UNSIGNED** - no minisign signature is attached because the signing key is not provisioned. `pantheon update` refuses unsigned releases by design; install this release by hand (see docs/release-signing.md).' >> "$GITHUB_OUTPUT"
          fi
      # The CLI assets used to ship without an SBOM while the desktop build
      # published one, so a consumer had no dependency inventory for the
      # binary the installer actually fetches (audit F8). Same pinned syft and
      # checksum as the desktop lane below; the SBOM files land in `dist/` and are
      # attached by the glob below. Non-blocking: a tool-download failure must
      # not hold a signed release hostage, and the step says so in the log.
      - name: generate SBOMs for the release assets
        continue-on-error: true
        env:
          SYFT_VERSION: '1.55.0'
          SYFT_SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools" "$HOME/.local/bin"
          cd "$RUNNER_TEMP/tools"
          file="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$file" "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/$file"
          echo "${SYFT_SHA256}  $file" | sha256sum -c -
          tar -xzf "$file" -C "$HOME/.local/bin" syft
          cd "$GITHUB_WORKSPACE"
          shopt -s nullglob
          for asset in dist/*.tar.gz dist/*.zip; do
            out="dist/$(basename "$asset").sbom.spdx.json"
            "$HOME/.local/bin/syft" "file:$asset" -o "spdx-json=$out" --quiet
          done
          ls -la dist/*.sbom.spdx.json
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
          body: "${{ steps.signing.outputs.status }}"

  desktop-build:
    needs: route
    if: needs.route.outputs.track == 'desktop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: darwin-aarch64, triple: aarch64-apple-darwin }
          # Native Intel runner: build.mjs only builds on the target's own host architecture.
          - { os: macos-15-intel, target: darwin-x86_64, triple: x86_64-apple-darwin }
          - { os: windows-2022, target: windows-x86_64, triple: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: windows-aarch64, triple: aarch64-pc-windows-msvc }
          - { os: ubuntu-22.04, target: linux-x86_64, triple: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: linux-aarch64, triple: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: desktop
    env:
      RELEASE_TARGET: ${{ matrix.target }}
      # Optional macOS signing. When APPLE_CERTIFICATE is not set, the app gets
      # an ad-hoc signature instead (see docs/releasing.md).
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.triple }}
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf squashfs-tools xvfb dbus-x11 xdg-utils
      - run: npm ci
      - run: npm run test:release
      - name: Configure Apple signing keychain
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        run: node scripts/release/ci-apple.mjs
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      - name: Build installer
        run: node scripts/release/build.mjs
        env:
          # Signs the in-app update file. Without these secrets the installers still
          # build, but the release offers no automatic update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Remote access (docs/remote-access.md). Public values, kept as repository variables;
          # without them the build shows remote access as not configured.
          PANTHEON_RELAY_URL: ${{ vars.PANTHEON_RELAY_URL }}
          PANTHEON_GITHUB_CLIENT_ID: ${{ vars.PANTHEON_GITHUB_CLIENT_ID }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && env.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Check packaged app startup (not GUI behavior)
        if: runner.os != 'macOS'
        timeout-minutes: 4
        run: node scripts/release/ci-startup-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pantheon-${{ needs.route.outputs.version }}-${{ matrix.target }}
          path: desktop/release/${{ needs.route.outputs.version }}/
          if-no-files-found: error
          retention-days: 14
      - name: Remove Apple signing keychain
        if: always() && runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        run: node scripts/release/ci-apple.mjs cleanup

  # Release assurance (docs/releasing.md): SBOMs and scan coverage. Findings and tool
  # failures are reported in SBOM-COVERAGE.md and never block the release.

  desktop-sbom:
    needs: [route, desktop-build]
    if: needs.route.outputs.track == 'desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        working-directory: desktop
    env:
      VERSION: ${{ needs.route.outputs.version }}
      SYFT_VERSION: '1.55.0'
      SYFT_SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
      GRYPE_VERSION: '0.121.0'
      GRYPE_SHA256: 64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: desktop/assets
          pattern: pantheon-${{ needs.route.outputs.version }}-*
          merge-multiple: true
      - name: Install syft and grype (pinned, checksum verified)
        run: |
          mkdir -p "$RUNNER_TEMP/tools" "$HOME/.local/bin"
          cd "$RUNNER_TEMP/tools"
          for tool in syft grype; do
            ver_var=${tool^^}_VERSION; sum_var=${tool^^}_SHA256
            file="${tool}_${!ver_var}_linux_amd64.tar.gz"
            curl -fsSL -o "$file" "https://github.com/anchore/$tool/releases/download/v${!ver_var}/$file"
            echo "${!sum_var}  $file" | sha256sum -c -
            tar -xzf "$file" -C "$HOME/.local/bin" "$tool"
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Generate SBOMs and scan coverage
        run: node scripts/release/sbom.mjs assets sbom "$VERSION" "$GITHUB_SHA"
      - name: Show coverage
        if: always()
        run: cat sbom/SBOM-COVERAGE.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pantheon-sbom-${{ needs.route.outputs.version }}
          path: desktop/sbom/
          if-no-files-found: warn
          retention-days: 14


  desktop-publish:
    needs: [route, desktop-build, desktop-sbom]
    if: needs.route.outputs.track == 'desktop' && (github.ref_type == 'tag' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    env:
      VERSION: ${{ needs.route.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: desktop/assets
          pattern: pantheon-${{ needs.route.outputs.version }}-*
          merge-multiple: true
      - name: Download SBOMs and scan coverage
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: desktop/assets
          name: pantheon-sbom-${{ needs.route.outputs.version }}
      - name: Write release notes
        env:
          # A Developer ID signed build is notarized; an ad-hoc one is not, and
          # macOS then needs a step the notes have to name.
          SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          {
            cat "releases/$VERSION.md"
            printf '\n\n'
            if [ "$SIGNED" = "true" ]; then node scripts/release/install-notes.mjs --signed; else node scripts/release/install-notes.mjs; fi
          } > "$RUNNER_TEMP/notes.md"
      - name: Write the updater manifest
        run: |
          if ls assets/*.sig >/dev/null 2>&1; then
            node scripts/release/updater-manifest.mjs assets "$VERSION" "releases/$VERSION.md"
          else
            echo "::warning::No signed update files; this release will not update installed apps."
          fi
      - name: Create GitHub Release
        # --latest=false: `install.sh` reads the CLI tag from /releases/latest, so an
        # app release must never take that slot.
        run: |
          ls -l assets
          gh release create "desktop-v$VERSION" assets/* \
            --title "Pantheon $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA" \
            --latest=false
      - name: Refresh the updater manifest release
        # The app's updater endpoint is pinned to
        # .../releases/download/desktop-latest/latest.json rather than /releases/latest,
        # so a CLI release published later cannot shadow the manifest. The Release is
        # created once and only its latest.json is replaced afterwards.
        run: |
          if [ ! -f assets/latest.json ]; then
            echo "::warning::No latest.json was built (unsigned release); the manifest is unchanged."
            exit 0
          fi
          gh release view desktop-latest >/dev/null 2>&1 ||
            gh release create desktop-latest \
              --title "Pantheon desktop updater manifest" \
              --notes "Fixed location for latest.json, the desktop app's update manifest. No installers here." \
              --latest=false
          gh release upload desktop-latest assets/latest.json --clobber


  desktop-npm:
    needs: [route, desktop-publish]
    if: needs.route.outputs.track == 'desktop' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.route.outputs.version }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish npx pantheon
        run: |
          if [ ! -f packages/npx/package.json ]; then
            echo "::warning::packages/npx is not present; skipping the npm publish of pantheon."
            exit 0
          fi
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set; skipping the npm publish of pantheon."
            exit 0
          fi
          cd packages/npx
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish --provenance --access public
