name: release

# Publishes prebuilt Pantheon binaries. The installer downloads these
# assets, so the names below are a contract: `install.sh`, `install.ps1`,
# and `pantheon update` all construct
#   pantheon-<tag>-<os>-<arch>.tar.gz  (linux, darwin)
#   pantheon-<tag>-<os>-<arch>.zip     (windows)
# Rename an asset here and the installer breaks on every machine.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }} on ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: linux
            arch: x86_64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: darwin
            arch: x86_64
            # GitHub retired the x86_64 macOS runner pool; macos-13 jobs
            # queue forever. The arm runner cross-builds this target with
            # the std installed, and the asset name is unchanged, so
            # install.sh on Intel Macs keeps working.
            runner: macos-latest
          - target: aarch64-apple-darwin
            os: darwin
            arch: aarch64
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows
            arch: x86_64
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      # No toolchain input: reads the pinned channel from
      # rust-toolchain.toml, same as the ci workflow.
      - uses: dtolnay/rust-toolchain@v1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: build
        run: cargo build --release --locked --bin pantheon --bin pantheon-helper --target ${{ matrix.target }}

      - name: package (unix)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/stage"
          mkdir -p "$staged"
          cp "target/${{ matrix.target }}/release/pantheon" "$staged/pantheon"
          cp "target/${{ matrix.target }}/release/pantheon-helper" "$staged/pantheon-helper"
          chmod +x "$staged/pantheon" "$staged/pantheon-helper"
          asset="pantheon-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          tar -czf "$RUNNER_TEMP/$asset" -C "$staged" pantheon pantheon-helper
          (cd "$RUNNER_TEMP" && sha256sum "$asset" > "$asset.sha256")
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: package (windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $staged = Join-Path $env:RUNNER_TEMP "stage"
          New-Item -ItemType Directory -Force -Path $staged | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/pantheon.exe" (Join-Path $staged "pantheon.exe")
          Copy-Item "target/${{ matrix.target }}/release/pantheon-helper.exe" (Join-Path $staged "pantheon-helper.exe")
          $asset = "pantheon-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.zip"
          Compress-Archive -Path (Join-Path $staged "pantheon.exe"),(Join-Path $staged "pantheon-helper.exe") -DestinationPath (Join-Path $env:RUNNER_TEMP $asset)
          $hash = (Get-FileHash (Join-Path $env:RUNNER_TEMP $asset) -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset" | Out-File -FilePath (Join-Path $env:RUNNER_TEMP "$asset.sha256") -Encoding ascii
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: sign asset (minisign)
        # Guarded, not required: until MINISIGN_SECRET_KEY is provisioned
        # (see docs/release-signing.md) this step skips and releases
        # ship unsigned - and `pantheon update` then fails closed rather
        # than installing them. Adding the step unconditionally would
        # break every release before provisioning.
        if: matrix.os != 'windows'
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "no MINISIGN_SECRET_KEY secret; skipping signing (releases stay unsigned until the key is provisioned)"
            exit 0
          fi
          case "${{ matrix.os }}" in
            linux) sudo apt-get update -qq && sudo apt-get install -y -qq minisign ;;
            darwin) brew install minisign ;;
          esac
          key="$RUNNER_TEMP/minisign.key"
          printf '%s' "$MINISIGN_SECRET_KEY" > "$key"
          chmod 600 "$key"
          minisign -S -s "$key" -m "$RUNNER_TEMP/$ASSET"
          rm -f "$key"
          ls -la "$RUNNER_TEMP/$ASSET.minisig"

      - name: sign asset (minisign, windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if (-not $env:MINISIGN_SECRET_KEY) { echo "no MINISIGN_SECRET_KEY secret; skipping signing"; exit 0 }
          choco install minisign -y --no-progress
          $key = Join-Path $env:RUNNER_TEMP "minisign.key"
          $env:MINISIGN_SECRET_KEY | Out-File -FilePath $key -Encoding ascii -NoNewline
          minisign -S -s $key -m (Join-Path $env:RUNNER_TEMP $env:ASSET)
          Remove-Item $key -Force

      - name: smoke test the packaged binary
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/smoke"
          mkdir -p "$tmp"
          if [ "${{ matrix.os }}" = "windows" ]; then
            unzip -o "$RUNNER_TEMP/$ASSET" -d "$tmp"
            "$tmp/pantheon.exe" --version
            "$tmp/pantheon.exe" --help > /dev/null
          else
            tar -xzf "$RUNNER_TEMP/$ASSET" -C "$tmp"
            "$tmp/pantheon" --version
            "$tmp/pantheon" --help > /dev/null
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/pantheon-*.tar.gz
            ${{ runner.temp }}/pantheon-*.zip
            ${{ runner.temp }}/pantheon-*.sha256
            ${{ runner.temp }}/pantheon-*.minisig

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: list assets
        run: ls -la dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
