[workspace]
resolver = "2"
members = [
  # Façade: re-exports every library crate; nothing depends on it.
  "crates/pantheon",
  "crates/pantheon-storage",
  "crates/pantheon-runtime",
  "crates/pantheon-api",
  "crates/pantheon-agent",
  "crates/pantheon-swarm",
  "crates/pantheon-exec",
  # Capability ≠ tool: the callable-operation layer (registry, builtins,
  # memory/vault/session-search tools) is its own crate, distinct from
  # pantheon-capability. Depends on pantheon-exec (Tools → Exec).
  "crates/pantheon-tools",
  "crates/pantheon-capability",
  "crates/pantheon-sandbox",
  "crates/pantheon-memory",
  "crates/pantheon-secrets",
  "crates/pantheon-providers",
  "crates/pantheon-mcp",
  "crates/pantheon-extensions",
  "crates/pantheon-scheduler",
  "crates/pantheon-gateway",
  "crates/pantheon-migration",
  # pantheon-tui is the one terminal application: the `pantheon` binary
  # (interactive session + non-interactive verbs) lives here.
  "crates/pantheon-tui",
  # Ledger-native self-improvement: reflection passes over structured
  # ledger signals, proposal generation with provenance, eval-gating,
  # approvals, application, and audit. Driven by pantheon-tui.
  "crates/pantheon-reflect",
  # Background memory consolidation: stage/weigh/promote passes over
  # ledger events, promoting durable facts into long-term memory with
  # provenance. Driven by pantheon-tui.
  "crates/pantheon-consolidate",
  # Web dashboard: std-only HTTP control plane over the ledger,
  # scheduler, config, keys, logs, skills/MCP, and gateway. Driven by
  # pantheon-tui (`pantheon dashboard`).
  "crates/pantheon-dashboard",
  # Behavioral/integration/eval test suite. Not shipped; runs with
  # `cargo test -p pantheon-eval`.
  "eval",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Pantheon"]

[profile.release]
lto = true
codegen-units = 1

# `PantheonError` is a structured value that carries code, layer,
# retryability, cause, remediation, evidence, and a recovery class to the
# CLI, the ledger, and the API. It is 128 bytes, so every `Result` in the
# workspace is a fat enum. Boxing it would add an allocation to every error
# path and touch every signature for a size win that does not matter here:
# failures are rare and already do disk and network I/O.
[workspace.lints.clippy]
result_large_err = "allow"

