[package]
name = "pantheon-eval"
version.workspace = true
edition = "2021"
publish = false

# Behavioral / integration / eval test suite for Pantheon.
#
# Behavioral and integration tests live here and run via
# `cargo test -p pantheon-eval`. Unit tests of private functions stay in
# inline `#[cfg(test)]` modules beside the code (many crates have them);
# `cargo test --workspace` runs both. Tautological, decorative,
# host-dependent-skip, live-network, and dead-behavior tests are deleted,
# not moved.
#
# Each file is one integration target: eval/tests/<crate>_<area>.rs.

[dev-dependencies]
pantheon = { path = "../crates/pantheon" }
pantheon-storage = { path = "../crates/pantheon-storage" }
pantheon-runtime = { path = "../crates/pantheon-runtime" }
pantheon-api = { path = "../crates/pantheon-api" }
pantheon-agent = { path = "../crates/pantheon-agent" }
pantheon-exec = { path = "../crates/pantheon-exec" }
pantheon-tools = { path = "../crates/pantheon-tools" }
pantheon-memory = { path = "../crates/pantheon-memory" }
pantheon-secrets = { path = "../crates/pantheon-secrets" }
pantheon-providers = { path = "../crates/pantheon-providers" }
pantheon-mcp = { path = "../crates/pantheon-mcp" }
pantheon-extensions = { path = "../crates/pantheon-extensions" }
pantheon-scheduler = { path = "../crates/pantheon-scheduler" }
pantheon-gateway = { path = "../crates/pantheon-gateway" }
pantheon-migration = { path = "../crates/pantheon-migration" }
pantheon-tui = { path = "../crates/pantheon-tui" }
pantheon-nightly = { path = "../crates/pantheon-nightly" }
pantheon-dashboard = { path = "../crates/pantheon-dashboard" }
pantheon-web = { path = "../crates/pantheon-web" }
ratatui = "0.30"
serde_json.workspace = true
toml.workspace = true
tempfile = "3"
tungstenite.workspace = true
serde_yaml.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
rusqlite = { workspace = true, features = ["bundled"] }
# Building fixture zips for the dashboard attachment-extraction tests.
zip.workspace = true
