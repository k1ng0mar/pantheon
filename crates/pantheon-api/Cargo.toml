[package]
name = "pantheon-api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# Bottom protocol leaf (commands, events, types). Must never depend on
# runtime, storage, gateway, tools, or anything above the leaf - every
# other crate in the workspace may depend on this one.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.11"
chrono = "0.4"
chrono-tz = "0.10"
iana-time-zone = "0.1"
# Image decode/resize for the vision pipeline (`downscale_image`): every
# crate may depend on the leaf, so the one shared downscale lives here.
# No default features: only the decoders/encoders the attach path sniffs
# (JPEG, PNG). GIF/WebP attachments pass through unscaled.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Cross-process file locking for the dotenv writers (`fs2::FileExt`):
# the in-process `DOTENV_WRITE_LOCK` mutex cannot serialize writers in
# *other* processes, so every read-modify-write also takes an exclusive
# flock on a sidecar `<target>.lock` file. Already in Cargo.lock via
# pantheon-scheduler; no new network dependency.
fs2 = "0.4"

[lints]
workspace = true
