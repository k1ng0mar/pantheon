[package]
name = "pantheon-doctor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# Structured diagnostics engine behind `pantheon doctor` and
# `GET /api/health`: findings vocabulary, diagnostic registry +
# orchestrator, check suite, renderers, and the health/contract builder.
# Both the TUI (`pantheon doctor`) and the dashboard (`/api/health`)
# consume this one pipeline - no duplicated check logic.
[dependencies]
pantheon-api = { path = "../pantheon-api" }
pantheon-storage = { path = "../pantheon-storage" }
pantheon-memory = { path = "../pantheon-memory" }
pantheon-providers = { path = "../pantheon-providers" }
pantheon-extensions = { path = "../pantheon-extensions" }
pantheon-exec = { path = "../pantheon-exec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[lints]
workspace = true
