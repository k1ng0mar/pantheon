[package]
name = "pantheon-migration"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
pantheon-api = { path = "../pantheon-api" }
pantheon-extensions = { path = "../pantheon-extensions" }
pantheon-storage = { path = "../pantheon-storage" }
# Custom-provider import reconciles against the provider catalog.
pantheon-providers = { path = "../pantheon-providers" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true

[dev-dependencies]
# Failure injection for the session-index tests: a second connection drops a
# table out from under the index under test.
rusqlite = { workspace = true, features = ["bundled"] }

[lints]
workspace = true
