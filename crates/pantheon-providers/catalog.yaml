# Pantheon provider + model catalog.
#
# Data-driven: edit this file to add providers without code changes.
# Override at runtime: PANTHEON_CATALOG=/path/to/own.yaml
#
# Fields per provider:
#   id          stable key (--provider ID)
#   label       human name for UI
#   base_url    full base URL (no trailing slash). May contain {placeholders}
#               for account/region/resource/project scoping — resolved at
#               request time from PANTHEON_<PROVIDER>_<VAR> (see docs/user-guide/providers.md).
#   api_mode    openai | anthropic
#   base_env    env var overriding base_url (e.g. PANTHEON_BASE_OPENAI)
#   key_env     env var holding the API key (vendor-native names preferred)
#   key_header  HTTP header carrying the key (default Authorization/Bearer;
#               e.g. Xiaomi MiMo wants `api-key` with the raw key)
#   models      curated model rows (see ModelMeta shape). Empty = undiscovered:
#               `pantheon model` asks the endpoint (GET {base}/models) instead.
#   prominent   show in the picker UI
#   tag         short blurb ("Chinese lab", "fast inference", ...)
#
# Any provider id NOT in this list falls back to OpenAI-compatible
# passthrough: the id itself is used as the base URL.

providers:
  - id: openai
    label: OpenAI
    base_url: https://api.openai.com/v1
    api_mode: openai
    base_env: PANTHEON_BASE_OPENAI
    key_env: OPENAI_API_KEY
    prominent: true
    tag: Major frontier lab
    models:
      - model: gpt-4o
        context_limit: 128000
        max_output_tokens: 16384
        tools: true
        vision: true
        reasoning: false
        streaming: true
        cost: { input_per_mtok_usd: 2.50, output_per_mtok_usd: 10.00 }
      - model: gpt-4o-mini
        context_limit: 128000
        max_output_tokens: 16384
        tools: true
        vision: true
        reasoning: false
        streaming: true
        cost: { input_per_mtok_usd: 0.15, output_per_mtok_usd: 0.60 }

