[package]
name = "pantheon-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
pantheon-api = { path = "../pantheon-api" }
pantheon-agent = { path = "../pantheon-agent" }
pantheon-consolidate = { path = "../pantheon-consolidate" }
pantheon-secrets = { path = "../pantheon-secrets" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# The provider catalog is YAML-backed.
serde_yaml = "0.9"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }


[lints]
workspace = true
