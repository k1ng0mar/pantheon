[package]
name = "pantheon-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# The one terminal application. The `pantheon` binary is a shim over
# `terminal::run()`; every verb and the interactive session live here.
[[bin]]
name = "pantheon"
path = "src/main.rs"

[dependencies]
pantheon-api = { path = "../pantheon-api" }
pantheon-gateway = { path = "../pantheon-gateway" }
pantheon-runtime = { path = "../pantheon-runtime" }
pantheon-exec = { path = "../pantheon-exec" }
# Direct tool registration paths (vault verbs, memory vault, registry).
pantheon-tools = { path = "../pantheon-tools" }
pantheon-extensions = { path = "../pantheon-extensions" }
pantheon-memory = { path = "../pantheon-memory" }
pantheon-secrets = { path = "../pantheon-secrets" }
pantheon-scheduler = { path = "../pantheon-scheduler" }
pantheon-swarm = { path = "../pantheon-swarm" }
pantheon-migration = { path = "../pantheon-migration" }
pantheon-agent = { path = "../pantheon-agent" }
# Model/provider metadata rendered in pickers comes from the catalog.
pantheon-providers = { path = "../pantheon-providers" }
pantheon-storage = { path = "../pantheon-storage" }
# Ledger-native self-improvement (reflection passes, proposals, audit).
pantheon-reflect = { path = "../pantheon-reflect" }
# Background memory consolidation (stage/weigh/promote over ledger events).
pantheon-consolidate = { path = "../pantheon-consolidate" }
# Web dashboard (std-only HTTP control plane). Driven by `pantheon dashboard`.
pantheon-dashboard = { path = "../pantheon-dashboard" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
ratatui = "0.30"
crossterm = "0.29"
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["tls"] }
ctrlc = "3.4"
# Minimal PNG inflate for the Sixel preview path (already in the lock).
flate2 = "1"

[lints]
workspace = true
