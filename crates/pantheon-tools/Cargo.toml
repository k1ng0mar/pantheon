[package]
name = "pantheon-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# Tools (registry + concrete callable operations), distinct from the
# capability-enforcement module inside pantheon-agent (what a policy
# allows). Depends downward on pantheon-exec per the target dependency
# direction: Tools → Exec. The sandbox hierarchy lives in
# pantheon-exec as `pantheon_exec::sandbox`.
[dependencies]
pantheon-api = { path = "../pantheon-api" }
pantheon-exec = { path = "../pantheon-exec" }
pantheon-extensions = { path = "../pantheon-extensions" }
pantheon-memory = { path = "../pantheon-memory" }
pantheon-providers = { path = "../pantheon-providers" }
pantheon-secrets = { path = "../pantheon-secrets" }
pantheon-storage = { path = "../pantheon-storage" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Persistent terminal sessions. `portable-pty` uses openpty on Unix and
# ConPTY on Windows; the tool manager owns the process for the session.
portable-pty = "0.9"
# Code Mode: an embedded QuickJS runtime with no host I/O of its own. The
# only way out is the explicitly installed tool bridge.
rquickjs = "0.14"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
