[package]
name = "pantheon-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
pantheon-api = { path = "../pantheon-api" }
pantheon-storage = { path = "../pantheon-storage" }
pantheon-agent = { path = "../pantheon-agent" }
pantheon-exec = { path = "../pantheon-exec" }
# The session registers tools (builtins/memory/vault/search/skills/plugin)
# through the tool-layer registry.
pantheon-tools = { path = "../pantheon-tools" }
pantheon-mcp = { path = "../pantheon-mcp" }
pantheon-providers = { path = "../pantheon-providers" }
pantheon-memory = { path = "../pantheon-memory" }
# Persona overlay: approved nightly persona notes are injected into
# fresh runs' system prompts (pantheon-nightly owns the namespace).
pantheon-nightly = { path = "../pantheon-nightly" }
pantheon-extensions = { path = "../pantheon-extensions" }
pantheon-secrets = { path = "../pantheon-secrets" }
# Web access: browser automation (gsd-browser subprocess wrapper) and web
# search (Tavily) as two tool surfaces in one crate. Registered in
# build_tool_registry behind the session's [browser]/[websearch] config.
pantheon-web = { path = "../pantheon-web" }
# The Runtime API's AG-UI path encodes generative-UI frames, SSE and
# signing through the gateway's shared encoders (dispatcher move: api →
# runtime, decision D4 in docs/decisions/0001).
pantheon-gateway = { path = "../pantheon-gateway" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }


[dev-dependencies]
tempfile = "3"
# Config-TOML parsing for the `--agent` profile-resolution tests (the same
# path `pantheon run --agent` takes through `Config::resolve_profile`).
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
# setsid for the kill-path tests (turn-child stand-ins need their own
# process group, mirroring the dashboard's turn spawner).
libc = "0.2"

[lints]
workspace = true
