[package]
name = "pantheon-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pantheon-api = { path = "../pantheon-api" }
pantheon-storage = { path = "../pantheon-storage" }
pantheon-secrets = { path = "../pantheon-secrets" }
serde_yaml = "0.9"
toml = "0.8"
sha2 = "0.11"
ureq = { version = "2", features = ["json", "proxy-from-env", "native-certs"] }
libc = "0.2"
# Kernel-level confinement layers, applied in the child between fork and
# exec. Linux-only: both are Linux kernel features.
[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"
landlock = "0.4"

zip = { version = "2", default-features = false, features = ["deflate"] }
# Context tests exercise provider-backed compression; the tool layer that
# used providers (session_search) and the memory-backed tools moved to
# `pantheon-tools`.
pantheon-providers = { path = "../pantheon-providers" }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
sha2 = "0.11"

[lints]
workspace = true
