[package]
name = "pantheon-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pantheon-api = { path = "../pantheon-api" }
pantheon-storage = { path = "../pantheon-storage" }
pantheon-secrets = { path = "../pantheon-secrets" }
serde_yaml = "0.9"
ureq = { version = "2", features = ["json"] }
libc = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Context tests exercise provider-backed compression; the tool layer that
# used providers (session_search) and the memory-backed tools moved to
# `pantheon-tools`.
pantheon-providers = { path = "../pantheon-providers" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
