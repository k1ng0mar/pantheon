[package]
name = "pantheon-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pantheon-core = { path = "../pantheon-core" }
pantheon-storage = { path = "../pantheon-storage" }
pantheon-memory = { path = "../pantheon-memory" }
serde_yaml = "0.9"
ureq = { version = "2", features = ["json"] }
libc = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
pantheon-sandbox = { path = "../pantheon-sandbox" }

[dev-dependencies]
tempfile = "3"
# Live compressor for context tests (real model via local router).
# Test-only coupling: production code never touches providers.
pantheon-providers = { path = "../pantheon-providers" }
