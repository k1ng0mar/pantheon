[package]
name = "pantheon-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
pantheon-api = { path = "../pantheon-api" }
pantheon-storage = { path = "../pantheon-storage" }
pantheon-secrets = { path = "../pantheon-secrets" }
serde_yaml.workspace = true
# Rust symbol/call graph for the code-intel group. `span-locations` gives
# nodes real source lines (syn does not carry them by default).
syn = { version = "3", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
toml.workspace = true
sha2.workspace = true
ureq = { workspace = true, features = ["json"] }
libc.workspace = true
# Skill import/export reads zip archives on every platform, so this stays
# out of the Linux-only section below.
zip.workspace = true
# Kernel-level confinement layers, applied in the child between fork and
# exec. Linux-only: both are Linux kernel features.
[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"
landlock = "0.4"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
sha2.workspace = true

[lints]
workspace = true
