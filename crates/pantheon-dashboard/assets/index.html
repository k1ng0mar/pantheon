<!doctype html>
<!--
  Pantheon dashboard shell. Vanilla SPA, no build step, embedded via
  include_str! by pantheon-dashboard.

  Every view renders loading, empty, and error states from the real API.
  No gradients, no fake data.
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pantheon">
<title>Pantheon: control plane</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gate" class="gate" hidden>
  <div class="gate-card">
    <div class="gate-brand"><span class="brand-mark" aria-hidden="true"></span>Pantheon</div>
    <p class="gate-sub">Paste the per-instance token printed by <span class="mono">pantheon dashboard</span> at startup.</p>
    <form id="gate-form">
      <input id="gate-token" class="input" type="password" autocomplete="off" spellcheck="false"
             placeholder="token" aria-label="dashboard token">
      <button class="btn primary" type="submit">Enter</button>
    </form>
    <p class="gate-note">The token lives in this tab only (sessionStorage). It is sent as X-Pantheon-Token.</p>
  </div>
</div>

<div id="app" class="app" hidden>
  <aside class="sidebar" aria-label="views">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Pantheon</span></div>
    <nav id="nav" class="nav"></nav>
    <div class="side-foot">
      <div id="gateway-dot" class="gw-line"><span class="dot" data-state="unknown"></span><span id="gateway-label">gateway ...</span></div>
      <div class="side-ver">v__PANTHEON_VERSION__</div>
    </div>
  </aside>

  <div class="content">
    <header class="topbar">
      <form id="topsearch-form" class="topsearch" role="search">
        <svg class="topsearch-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="topsearch" class="topsearch-input" type="search" placeholder="Search runs, or type a command..." aria-label="search runs" autocomplete="off" spellcheck="false">
        <kbd class="topsearch-kbd">⌘K</kbd>
      </form>
      <div class="topbar-right">
        <button id="theme-toggle" class="icon-btn" aria-label="toggle theme" title="Toggle theme">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <a class="icon-btn" href="#/approvals" aria-label="approvals" title="Approvals">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="icon-badge" data-badge="approvals" hidden></span>
        </a>
        <a class="icon-btn" href="#/config" aria-label="settings" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.9.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.9v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </a>
        <span class="user-chip"><span class="user-avatar">U</span><span class="user-name">Umar</span></span>
      </div>
    </header>
    <main class="main">
      <section id="view" class="view" tabindex="-1"></section>
    </main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
