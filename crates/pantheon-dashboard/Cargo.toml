[package]
name = "pantheon-dashboard"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# Pantheon's web dashboard: a std-only HTTP/1.1 server (no tokio, no axum - 
# the rest of Pantheon is std-only) serving a single self-contained SPA over
# the event ledger, scheduler, approvals, stats, and memory. Localhost-only
# by default; that is the whole protection model for the approval actions.

[dependencies]
pantheon-api = { path = "../pantheon-api" }
pantheon-storage = { path = "../pantheon-storage" }
pantheon-runtime = { path = "../pantheon-runtime" }
pantheon-secrets = { path = "../pantheon-secrets" }
pantheon-scheduler = { path = "../pantheon-scheduler" }
pantheon-memory = { path = "../pantheon-memory" }
pantheon-exec = { path = "../pantheon-exec" }
# Hook-plugin approval wrappers for the plugin-management routes.
pantheon-extensions = { path = "../pantheon-extensions" }
# Bundled MCP catalog types: the dashboard consumes the sibling worker's
# `pantheon_mcp::bundled` directly (no api seam) - dashboard -> mcp is
# cycle-free (mcp -> tools -> {api, exec, ...}, never dashboard).
pantheon-mcp = { path = "../pantheon-mcp" }
pantheon-migration = { path = "../pantheon-migration" }
pantheon-gateway = { path = "../pantheon-gateway" }
pantheon-nightly = { path = "../pantheon-nightly" }
pantheon-web = { path = "../pantheon-web" }
# Swarm routes: real subprocess agents run through the runtime orchestrator;
# the `[judge]` aux model resolves through the providers aux HTTP helpers.
pantheon-agent = { path = "../pantheon-agent" }
pantheon-providers = { path = "../pantheon-providers" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# toml 0.8 re-exports Datetime only privately; parse datetimes directly.
toml_datetime = "0.6"
# Sync tungstenite (no TLS features - the dashboard is plain HTTP on
# localhost); the browser take-control stream reuses the WS takeover
# pattern live voice established in pantheon-gateway.
tungstenite = { version = "0.30.0" }
# setsid for turn-child spawning (killable process groups).
libc = "0.2"
# Outbound HTTPS for the link-preview endpoint (sync, rustls). No
# proxy-from-env: a proxy would tunnel past the endpoint's SSRF guard.
ureq = { version = "2", default-features = false, features = ["tls", "native-certs"] }
url = "2"
# Plugin import pipeline: gzip/deflate decoding for GitHub tarballs
# (tar entries are parsed by hand - no new native deps beyond flate2).
flate2 = "1"
# Zip extraction for chat attachments: an attached zip is inflated
# server-side at message-send time so the agent can read the contents
# with its file tools (same fail-closed limits as pantheon-exec skills).
zip = { version = "2", default-features = false, features = ["deflate"] }
# Plugin import pipeline: parse/emit manifest.yaml and plugin.yaml.
serde_yaml = "0.9"

[lints]
workspace = true
