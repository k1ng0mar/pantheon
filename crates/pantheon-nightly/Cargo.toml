[package]
name = "pantheon-nightly"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Nightly self-improvement: one ledger scan feeds behavior proposals (skills, persona) and memory promotion, with eval-gating, replay-based validation, approvals, and audit. Deterministic by default; LLM steps are opt-in and routed through cheap auxiliary slots."

[dependencies]
pantheon-api = { path = "../pantheon-api" }
pantheon-storage = { path = "../pantheon-storage" }
pantheon-memory = { path = "../pantheon-memory" }
pantheon-scheduler = { path = "../pantheon-scheduler" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
